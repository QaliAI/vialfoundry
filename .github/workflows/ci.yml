name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: vf_commerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vf_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/vf_commerce_test

      - name: Run TypeScript Checks
        run: npm run typecheck

      - name: Run Linter
        run: npm run lint

      - name: Run Production Verification Suite
        run: npm run check:prod

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: production
